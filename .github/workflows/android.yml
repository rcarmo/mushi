name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Bundle, type check and test (Bun only)
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          bun run check
          bun test
          bash -n android/start-agent.sh
      - name: Verify overlay idempotency
        run: |
          bun run android:prepare
          bun run android:prepare

  apk:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MUSHI_ARCHITECTURES: aarch64
      TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Small native bridge and application build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - name: Fetch locked prebuilts, relocate, compile bridge and package APK
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run android:build
      - uses: actions/upload-artifact@v4
        with:
          name: mushi-bun-runtime-arm64
          path: build/prebuilt/bootstraps/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: mushi-apk-arm64
          path: build/android/termux-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
